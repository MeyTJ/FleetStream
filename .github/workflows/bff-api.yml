name: bff-api

on:
  push:
    paths: ["BffApi/**", ".github/workflows/bff-api.yml"]
  pull_request:
    paths: ["BffApi/**", ".github/workflows/bff-api.yml"]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: BffApi
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - run: dotnet restore FleetStream.sln
      - run: dotnet build FleetStream.sln -c Release --no-restore
      - run: dotnet test FleetStream.sln -c Release --no-build --verbosity normal --filter "FullyQualifiedName!~Integration"

  docker:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: BffApi
          file: BffApi/docker/Dockerfile
          push: false
          tags: fleetstream/bff-api:ci
