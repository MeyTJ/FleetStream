name: ingress-gateway

on:
  push:
    paths: ["ingress-gateway/**", ".github/workflows/ingress-gateway.yml"]
  pull_request:
    paths: ["ingress-gateway/**", ".github/workflows/ingress-gateway.yml"]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ingress-gateway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.21"
          cache-dependency-path: ingress-gateway/go.sum
      - run: go build -o ingress-gateway ./cmd/server
      - run: go test ./... -count=1

  docker:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ingress-gateway
          file: ingress-gateway/Dockerfile
          push: false
          tags: fleetstream/ingress-gateway:ci
