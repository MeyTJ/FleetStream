name: streaming-engine

on:
  push:
    paths: ["streaming-engine/**"]
  pull_request:
    paths: ["streaming-engine/**"]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: streaming-engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.21"
          cache-dependency-path: streaming-engine/go.sum
      - run: go build -o streaming-engine ./cmd/processor
      - run: go test ./... -count=1

  docker:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: streaming-engine
          file: streaming-engine/Dockerfile
          push: false
          tags: fleetstream/streaming-engine:ci
