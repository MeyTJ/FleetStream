apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: fleetstream
  labels:
    app: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: fleetstream/frontend:latest
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: NODE_ENV
              value: "production"
            # Only HOSTNAME/PORT are read at runtime; the NEXT_PUBLIC_* and
            # CSP_CONNECT_SRC values are baked in at image build time because
            # Next inlines them into the client bundle. Build the image with
            # --build-arg for the target environment.
            - name: HOSTNAME
              value: "0.0.0.0"
            - name: PORT
              value: "3000"
          livenessProbe:
            httpGet:
              path: /login
              port: http
            initialDelaySeconds: 15
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /login
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: fleetstream
  labels:
    app: frontend
spec:
  selector:
    app: frontend
  ports:
    - name: http
      port: 3000
      targetPort: http
