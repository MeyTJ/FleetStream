version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: fleetstream-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - fleetstream-net

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: fleetstream-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - fleetstream-net

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: fleetstream-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    networks:
      - fleetstream-net

  bff-api:
    profiles: ["production"]
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: fleetstream-bff-api
    ports:
      - "8080:8080"
    depends_on:
      - redis
      - kafka
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Redis: "redis:6379,abortConnect=false"
      ConnectionStrings__Kafka: "kafka:9092"
      Kafka__Brokers: "kafka:9092"
      Jwt__Issuer: ${JWT_ISSUER:-https://auth.fleetstream.example.com}
      Jwt__Audience: ${JWT_AUDIENCE:-fleetstream-bff}
      Jwt__JwksUri: ${JWT_JWKS_URI:-https://auth.fleetstream.example.com/.well-known/jwks.json}
    networks:
      - fleetstream-net
    restart: unless-stopped

  bff-api-dev:
    profiles: ["dev"]
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: fleetstream-bff-api-dev
    ports:
      - "8080:8080"
    depends_on:
      - redis
      - kafka
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Redis: "redis:6379,abortConnect=false"
      ConnectionStrings__Kafka: "kafka:9092"
      Kafka__Brokers: "kafka:9092"
      Jwt__Issuer: ${JWT_ISSUER:-https://auth.fleetstream.example.com}
      Jwt__Audience: ${JWT_AUDIENCE:-fleetstream-bff}
      Jwt__SigningKey: ${JWT_SIGNING_KEY:-this-is-a-dev-signing-key-at-least-32-chars!!}
    networks:
      - fleetstream-net
    restart: unless-stopped

networks:
  fleetstream-net:
    driver: bridge
